[package]
name = "novastitch-designer"
description = "NOVAstitch Designer — vector embroidery digitizing. Based on Filum."
version = "0.1.0"
authors = ["Poletti Centro Cucito"]
repository = "https://github.com/effepol/NOVAstitch-designer"
edition.workspace = true
license.workspace = true

[lib]
name = "filum_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
