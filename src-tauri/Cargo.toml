[package]
name = "filum-desktop"
description = "NOVAstitch Designer — embroidery editor (Tauri shell for Windows, macOS and Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "filum_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
