[workspace]
resolver = "2"
members = ["crates/core", "crates/formats", "crates/wasm", "crates/cli", "crates/schema-gen", "src-tauri"]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/benkl/filum"
authors = ["Benjamin Kleinert"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kurbo = "0.13"
roxmltree = "0.21"
svgtypes = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
filum-core = { path = "crates/core" }
filum-formats = { path = "crates/formats" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
