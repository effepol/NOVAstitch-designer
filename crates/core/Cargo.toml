[package]
name = "filum-core"
description = "Filum embroidery engine: geometry, stitch generators (ported from Ink/Stitch), stitch plans and machine file formats."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["digitize"]
digitize = ["dep:image"]
# scope timers (see src/prof.rs), for examples/plan_bench
prof = []
# NOVAstitch: the JSON Schema of the document model (schemars), for the public
# schema in schema/ (generated by crates/schema-gen). Off in every normal build.
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
kurbo.workspace = true
roxmltree.workspace = true
svgtypes.workspace = true
filum-formats.workspace = true
image = { workspace = true, optional = true }
clipper2-rust = "1.2.0"
schemars = { version = "1.2", optional = true }
