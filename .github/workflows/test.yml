# NOVAstitch Designer: the same checks as `npm test`, on every pull request and on main.
# Rust engine tests, the engine built to WebAssembly (the UI type-checks against it),
# TypeScript, the UI logic tests (Filum's and the nova modules'), wording, design and text checks,
# then the interface tour in Chromium (module i).
name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Rust (stable, with the WebAssembly target)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # the version must match wasm-bindgen in Cargo.lock
      - name: wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: JavaScript dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Engine to WebAssembly
        run: npm run wasm

      # the interface tour (giro) has its own step below, with the browser it needs
      - name: npm test (cargo test, tsc, test:match, wording, design, texts)
        run: npm test
        env:
          NOVA_SALTA_GIRO: "1"

      # Module i: Playwright opens every menu, panel and dialog in Chromium,
      # Italian and English (contract tests i.1, i.3, i.4), with a photo of each
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Interface tour (giro)
        run: node ui/src/nova/i18n/filum/giro.mjs
        env:
          NOVA_GIRO_DIR: ${{ runner.temp }}/giro

      - name: Interface tour photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giro-filum
          path: ${{ runner.temp }}/giro
          if-no-files-found: ignore
